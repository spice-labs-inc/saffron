name: Build and Test

on:
  push:
    branches: ["**"]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots -DskipTests install

      - name: Test with Maven
        # Use 'small' mode with 1GB max for deterministic, fast test coverage
        # This selects smallest images to cover all filesystem types
        run: mvn --batch-mode --update-snapshots -Pci verify -Dsaffron.corpus.mode=small -Dsaffron.corpus.maxSizeGb=1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/site/jacoco/
