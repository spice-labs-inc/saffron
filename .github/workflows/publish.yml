name: Publish Saffron

on:
  release:
    types: [published]

jobs:
  publish_jars:
    name: Publish JAR Artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      successor-ok: ${{ steps.version.outputs.successor_ok }}
      thread-ts: ${{ steps.release-notification.outputs.thread-ts }}
      channel-id: ${{ steps.release-notification.outputs.channel-id }}

    steps:
      - name: Notify release
        id: release-notification
        uses: spice-labs-inc/action-release-notification@v3.3
        with:
          type: release
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          username-mapping: ${{ vars.GH_SLACK_USERNAME_MAPPING }}
          github-token: ${{ github.token }}

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          # Full history and tags: the successor check compares this release
          # tag against every previously released version.
          fetch-depth: 0

      - name: Extract and Validate Version
        id: version
        env:
          # tag_name is "vX.Y.Z" (no refs/tags/ prefix) for the release event.
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git tag --list > /tmp/all-tags.txt
          python3 .github/scripts/check-release-tag.py \
            "${TAG_NAME}" /tmp/all-tags.txt >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21 and GitHub Maven auth
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
          server-id: github
          server-username: ${{ secrets.GH_USERNAME_SG }}
          server-password: ${{ secrets.GH_TOKEN }}
          token: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          gpg-private-key: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}

      - name: Write settings.xml for GitHub + Maven Central
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">

            <servers>
              <server>
                <id>github</id>
                <username>${{ secrets.GH_USERNAME_SG }}</username>
                <password>${{ secrets.GH_TOKEN }}</password>
              </server>
              <server>
                <id>central</id>
                <username>${{ secrets.MAVEN_CENTRAL_USERNAME }}</username>
                <password>${{ secrets.MAVEN_CENTRAL_PASSWORD }}</password>
              </server>
            </servers>

          </settings>
          EOF

      - name: Import GPG Key
        run: |
          echo "${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Set Release Version
        run: |
          mvn versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      - name: Build and publish to GitHub Packages
        run: mvn --batch-mode clean deploy -P github -DskipTests -DskipCorpusDownload=true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}

      - name: Build and publish to Maven Central
        run: |
          mvn --batch-mode clean deploy -P maven-central -DskipTests -DskipCorpusDownload=true \
            -Dcentral.autoPublish=${{ steps.version.outputs.auto_publish }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}

      - name: Upload JAR to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/saffron-${{ steps.version.outputs.version }}.jar
            target/saffron-${{ steps.version.outputs.version }}-sources.jar
            target/saffron-${{ steps.version.outputs.version }}-javadoc.jar

      # `mvn deploy` succeeds even when the deployment is only staged, so without
      # this the run would go green with nothing on Maven Central -- a version
      # everyone believes shipped but consumers cannot resolve. Fail the run so a
      # parked release is impossible to miss.
      - name: Flag release awaiting manual confirmation
        if: steps.version.outputs.successor_ok != 'true'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          {
            echo "## :warning: Maven Central release awaiting manual confirmation"
            echo
            if [ -n "${PREVIOUS}" ]; then
              echo "\`${TAG_NAME}\` is not a natural successor to \`${PREVIOUS}\`."
              echo "Expected one of: ${{ steps.version.outputs.expected }}."
            else
              echo "\`${TAG_NAME}\` is lower than every existing release."
            fi
            echo
            echo "The deployment was uploaded and validated, but **has not been published**."
            echo "It is waiting in the [Central Portal](https://central.sonatype.com/publishing/deployments):"
            echo
            echo "- **Publish** it if this version number is deliberate."
            echo "- **Drop** it otherwise, then delete the \`${TAG_NAME}\` release and tag and cut the correct version."
            echo
            echo "GitHub Packages already has \`${TAG_NAME}\`; delete that package version too if you drop this."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Maven Central release awaiting confirmation::${TAG_NAME} was not published automatically${PREVIOUS:+ (does not follow ${PREVIOUS})}. The deployment is parked in the Central Portal and must be published or dropped by hand."
          exit 1

  notify:
    needs: [publish_jars]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check deployment status
        id: deployment-status
        shell: bash
        run: |
          JAR_STATUS="${{ needs.publish_jars.result }}"
          SUCCESSOR_OK="${{ needs.publish_jars.outputs.successor-ok }}"

          if [ "$JAR_STATUS" == "success" ]; then
            echo "overall_status=success" >> $GITHUB_OUTPUT
            echo "message=✅ All components deployed successfully!" >> $GITHUB_OUTPUT
            echo "workflow_name=${{ github.workflow }}" >> $GITHUB_OUTPUT
          elif [ "$SUCCESSOR_OK" == "false" ]; then
            # Staged, not failed: the artifacts are uploaded and validated but
            # parked in the Central Portal pending a human decision. Reported as
            # a failure because nothing is on Maven Central yet.
            echo "overall_status=failure" >> $GITHUB_OUTPUT
            echo "message=⚠️ Awaiting manual confirmation in the Maven Central Portal." >> $GITHUB_OUTPUT
            echo "workflow_name=${{ github.workflow }} — AWAITING MANUAL CONFIRMATION in the Maven Central Portal" >> $GITHUB_OUTPUT
          else
            echo "overall_status=failure" >> $GITHUB_OUTPUT
            echo "message=❌ JAR publishing failed." >> $GITHUB_OUTPUT
            echo "workflow_name=${{ github.workflow }}" >> $GITHUB_OUTPUT
          fi

      - name: Notify deployment result
        uses: spice-labs-inc/action-release-notification@v3.3
        with:
          type: ${{ steps.deployment-status.outputs.overall_status == 'success' && 'deployment-success' || 'deployment-failure' }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          username-mapping: ${{ vars.GH_SLACK_USERNAME_MAPPING }}
          github-token: ${{ github.token }}
          workflow-name: ${{ steps.deployment-status.outputs.workflow_name }}
          environment: production
          thread-ts: ${{ needs.publish_jars.outputs.thread-ts }}
          channel-id: ${{ needs.publish_jars.outputs.channel-id }}